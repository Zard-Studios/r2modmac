[package]
name = "r2modmac"
version = "0.8.3"
description = "A Tauri App"
authors = ["Zard Studios"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "r2modmac"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# reqwest: only gzip (Thunderstore uses gzip). Brotli + stream pull in large extra
# transitive crates (brotli decoder, h2 streaming machinery) that inflate RSS.
reqwest = { version = "0.11", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
zip = "0.6"
walkdir = "2"
open = "5"
dirs = "5"
# tokio: drop "full" runtime (which enables fs/process/signal/io-threads, etc).
# The app only needs the multi-thread runtime + macros + time (sleep) + sync (RwLock).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
notify = "6.1.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
serde_yaml = "0.9.34"
base64 = "0.22.1"
flate2 = "1.0"
tar = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
urlencoding = "2.1.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
sha2 = "0.10"

[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
# Trim release binary + reduce allocator churn, lowering resident memory.
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"
