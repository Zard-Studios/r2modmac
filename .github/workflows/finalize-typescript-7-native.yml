name: Finalize TypeScript 7 native migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    if: github.event.pull_request.number == 21 && github.head_ref == 'chore/typescript-7-native'
    runs-on: macos-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/typescript-7-native
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify compiler and API versions
        shell: bash
        run: |
          COMPILER_VERSION=$(npx tsc --version)
          echo "$COMPILER_VERSION"
          [[ "$COMPILER_VERSION" == Version\ 7.* ]]

          API_VERSION=$(node -e "const ts = require('typescript'); process.stdout.write(ts.version)")
          echo "TypeScript API: $API_VERSION"
          [[ "$API_VERSION" == 6.* ]]

      - name: Build and lint
        run: |
          npm run build
          npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-typescript-7-native.yml

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/finalize-typescript-7-native.yml
          git commit -m 'chore: adopt TypeScript 7 native compiler'
          git push origin HEAD:chore/typescript-7-native

      - name: Squash merge and delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sleep 5
          gh pr ready 21
          gh pr merge 21 \
            --squash \
            --delete-branch \
            --subject 'chore: adopt TypeScript 7 native compiler' \
            --body 'Use the official side-by-side TypeScript 7 compiler and TypeScript 6 API configuration after successful compiler/API version checks, build, lint, and production audit.'
