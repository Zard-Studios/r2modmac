name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.settings.platform }}
    env:
      # Set as a GitHub Actions secret after the Vercel proxy is deployed. An unset value
      # deliberately leaves sponsor traffic disabled in the distributed application.
      R2MODMAC_SPONSOR_PROXY_URL: ${{ secrets.R2MODMAC_SPONSOR_PROXY_URL }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: "Apple Silicon"
            platform: "macos-latest"
            rust-target: "aarch64-apple-darwin"
            arch: "aarch64"
          - name: "Intel"
            platform: "macos-latest"
            rust-target: "x86_64-apple-darwin"
            arch: "x86_64"
          - name: "Windows x64"
            platform: "windows-latest"
            rust-target: "x86_64-pc-windows-msvc"
            arch: "x64"
          - name: "Windows x86"
            platform: "windows-latest"
            rust-target: "i686-pc-windows-msvc"
            arch: "x86"
          - name: "Windows ARM64"
            platform: "windows-latest"
            rust-target: "aarch64-pc-windows-msvc"
            arch: "arm64"
          - name: "Linux x64"
            platform: "ubuntu-22.04"
            rust-target: "x86_64-unknown-linux-gnu"
            arch: "x64"
          - name: "Linux ARM64"
            platform: "ubuntu-24.04-arm"
            rust-target: "aarch64-unknown-linux-gnu"
            arch: "arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust (macOS)
        if: matrix.settings.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Rust (Windows)
        if: matrix.settings.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-target }}

      - name: Setup Rust (Linux)
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install dependencies
        run: npm ci

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          node -e "
            const fs = require('fs');
            const version = process.argv[1];
            
            // Update package.json + package-lock.json
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const lock = JSON.parse(fs.readFileSync('package-lock.json'));
            lock.version = version;
            if (lock.packages?.['']) lock.packages[''].version = version;
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            
            // Update tauri.conf.json
            const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
            tauriConf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2) + '\n');

            // Keep the Rust package version in sync as well. Cargo refreshes
            // the root lock entry during the build.
            const cargoPath = 'src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8').replace(
              /^(version\s*=\s*)\"[^\"]+\"/m,
              (_match, prefix) => prefix + '\"' + version + '\"'
            );
            fs.writeFileSync(cargoPath, cargo);
            
            console.log('Synchronized npm, Tauri, and Cargo versions to ' + version);
          " "$TAG_VERSION"

      - name: Install create-dmg
        if: matrix.settings.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Build Tauri app (macOS)
        if: matrix.settings.platform == 'macos-latest'
        run: npm run tauri build -- --target ${{ matrix.settings.rust-target }} --bundles app

      - name: Build Tauri app (Windows)
        if: matrix.settings.platform == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.settings.rust-target }} --no-bundle

      - name: Build Tauri app (Linux)
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        run: npm run tauri build -- --target ${{ matrix.settings.rust-target }} --no-bundle

      - name: Create Custom DMG
        if: matrix.settings.platform == 'macos-latest'
        run: |
          mkdir -p dmg_root
          cp -r src-tauri/target/${{ matrix.settings.rust-target }}/release/bundle/macos/r2modmac.app dmg_root/
          cp UNVERIFIED_APP_INSTRUCTIONS.txt dmg_root/
          
          # Create DMG
          create-dmg \
            --volname "r2modmac" \
            --volicon "src-tauri/icons/icon.icns" \
            --window-pos 200 120 \
            --window-size 800 500 \
            --icon-size 100 \
            --icon "r2modmac.app" 200 190 \
            --hide-extension "r2modmac.app" \
            --app-drop-link 600 185 \
            --icon "UNVERIFIED_APP_INSTRUCTIONS.txt" 400 350 \
            "r2modmac_macos_${{ matrix.settings.arch }}.dmg" \
            "dmg_root"

      - name: Package Windows Binary
        if: matrix.settings.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.settings.rust-target }}/release
          7z a ../../../../r2modmac_windows_${{ matrix.settings.arch }}.zip r2modmac.exe

      - name: Package Linux Binary
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        run: |
          cd src-tauri/target/${{ matrix.settings.rust-target }}/release
          # The self-updater (stage_linux_update in secure_system_commands.rs) requires
          # this archive to contain exactly one entry: the executable named "r2modmac"
          # at the archive root.
          tar -czf ../../../../r2modmac_linux_${{ matrix.settings.arch }}.tar.gz r2modmac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.settings.rust-target }}
          path: |
            r2modmac_macos_${{ matrix.settings.arch }}.dmg
            r2modmac_windows_${{ matrix.settings.arch }}.zip
            r2modmac_linux_${{ matrix.settings.arch }}.tar.gz
          if-no-files-found: ignore
          retention-days: 1

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: build-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            # ${{ github.ref_name }} Release

            ## News and improvements
            - Added automated Linux (x64 and ARM64) release builds.
            - Added a Verbose app logging option and a button to open the log folder, for easier troubleshooting.
            - Added an in-app dialog explaining why a game launch stalled (a Steam Cloud conflict, a pending update) instead of failing silently.
            - Improved Sync and Apply speed on macOS by cloning Apply snapshots instead of copying them, and by installing mods with a sliding concurrency pool instead of fixed batches.

            ## Fixes
            - Fixed "Sync Failed" errors caused by BOM- or UTF-16-encoded manifest.json files in some Thunderstore mods.
            - Fixed same-named ReturnOfModding mods from different authors (for example, two different "ENVY" packages) overwriting each other.
            - Fixed the Play button silently resetting to idle when Steam had to start cold before launching a modded game.
          files: |
            release_files/*.dmg
            release_files/*.zip
            release_files/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
