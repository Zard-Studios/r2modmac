name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.settings.platform }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: "Apple Silicon"
            platform: "macos-latest"
            rust-target: "aarch64-apple-darwin"
            arch: "aarch64"
          - name: "Intel"
            platform: "macos-latest"
            rust-target: "x86_64-apple-darwin"
            arch: "x86_64"
          - name: "Windows x64"
            platform: "windows-latest"
            rust-target: "x86_64-pc-windows-msvc"
            arch: "x64"
          - name: "Windows x86"
            platform: "windows-latest"
            rust-target: "i686-pc-windows-msvc"
            arch: "x86"
          - name: "Windows ARM64"
            platform: "windows-latest"
            rust-target: "aarch64-pc-windows-msvc"
            arch: "arm64"
          - name: "Linux x64"
            platform: "ubuntu-22.04"
            rust-target: "x86_64-unknown-linux-gnu"
            arch: "x64"
          - name: "Linux ARM64"
            platform: "ubuntu-24.04-arm"
            rust-target: "aarch64-unknown-linux-gnu"
            arch: "arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust (macOS)
        if: matrix.settings.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Rust (Windows)
        if: matrix.settings.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-target }}

      - name: Setup Rust (Linux)
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install dependencies
        run: npm ci

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          node -e "
            const fs = require('fs');
            const version = process.argv[1];
            
            // Update package.json + package-lock.json
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const lock = JSON.parse(fs.readFileSync('package-lock.json'));
            lock.version = version;
            if (lock.packages?.['']) lock.packages[''].version = version;
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            
            // Update tauri.conf.json
            const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
            tauriConf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2) + '\n');

            // Keep the Rust package version in sync as well. Cargo refreshes
            // the root lock entry during the build.
            const cargoPath = 'src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8').replace(
              /^(version\s*=\s*)\"[^\"]+\"/m,
              (_match, prefix) => prefix + '\"' + version + '\"'
            );
            fs.writeFileSync(cargoPath, cargo);
            
            console.log('Synchronized npm, Tauri, and Cargo versions to ' + version);
          " "$TAG_VERSION"

      # The app is developed and tested on a Mac, but it ships on Windows and
      # Linux too. The backend holds what differs between systems (paths, Steam
      # libraries, executables), so its tests run here, once per system, and a
      # release only goes out when they pass there as well: the release job
      # below needs every build. They run only at release time to spare Actions
      # minutes. The Tauri crate needs the frontend built, hence `npm run build`.
      - name: Run backend tests (Windows and Linux)
        if: matrix.settings.name == 'Windows x64' || matrix.settings.name == 'Linux x64'
        shell: bash
        run: |
          npm run build
          cd src-tauri
          cargo test --lib

      - name: Install create-dmg
        if: matrix.settings.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Setup .NET (macOS)
        if: matrix.settings.platform == 'macos-latest'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Native Apple Silicon for BepInEx 5 games (tools/apple-silicon), bundled into the app.
      - name: Build Apple Silicon add-on (macOS)
        if: matrix.settings.platform == 'macos-latest'
        run: tools/apple-silicon/build.sh

      # Code signing. Every secret below is optional: without them the build
      # carries on unsigned, as before. A secret reaches only the step that
      # lists it under `env`, never the other steps of the job.
      - name: Import signing certificate (macOS)
        if: matrix.settings.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "No signing certificate configured: building unsigned."
            exit 0
          fi

          # A throwaway keychain with a random password, deleted at the end.
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"

          base64 --decode <<<"$APPLE_CERTIFICATE" > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$certificate"

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      # Tauri signs the app but is not given the notarization credentials: it
      # would notarize before the loose dylibs are signed, and Apple would
      # reject that. The script below finishes the job.
      - name: Build Tauri app (macOS)
        if: matrix.settings.platform == 'macos-latest'
        run: npm run tauri build -- --target ${{ matrix.settings.rust-target }} --bundles app --config src-tauri/tauri.apple-silicon.conf.json

      - name: Sign and notarize app (macOS)
        if: matrix.settings.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_API_KEY_P8:-}" && -n "${APPLE_API_KEY:-}" ]]; then
            umask 077
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          scripts/macos-sign-and-notarize.sh "src-tauri/target/${{ matrix.settings.rust-target }}/release/bundle/macos/r2modmac.app"

      - name: Build Tauri app (Windows)
        if: matrix.settings.platform == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.settings.rust-target }} --no-bundle

      - name: Build Tauri app (Linux)
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        run: npm run tauri build -- --target ${{ matrix.settings.rust-target }} --no-bundle

      - name: Create Custom DMG
        if: matrix.settings.platform == 'macos-latest'
        run: |
          mkdir -p dmg_root
          # ditto, not cp: cp can break a code signature.
          ditto src-tauri/target/${{ matrix.settings.rust-target }}/release/bundle/macos/r2modmac.app dmg_root/r2modmac.app

          # Only an app that fails Gatekeeper needs the instructions.
          extra_icon_args=()
          if scripts/app-is-verified.sh dmg_root/r2modmac.app; then
            echo "App is signed and notarized: leaving out UNVERIFIED_APP_INSTRUCTIONS.txt"
          else
            cp UNVERIFIED_APP_INSTRUCTIONS.txt dmg_root/
            extra_icon_args=(--icon "UNVERIFIED_APP_INSTRUCTIONS.txt" 400 350)
          fi

          # Create DMG
          create-dmg \
            --volname "r2modmac" \
            --volicon "src-tauri/icons/icon.icns" \
            --window-pos 200 120 \
            --window-size 800 500 \
            --icon-size 100 \
            --icon "r2modmac.app" 200 190 \
            --hide-extension "r2modmac.app" \
            --app-drop-link 600 185 \
            ${extra_icon_args[@]+"${extra_icon_args[@]}"} \
            "r2modmac_macos_${{ matrix.settings.arch }}.dmg" \
            "dmg_root"

          # The app inside is already notarized; signing the disk image too
          # lets Gatekeeper recognise the download itself.
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "r2modmac_macos_${{ matrix.settings.arch }}.dmg"
          fi

      - name: Package Windows Binary
        if: matrix.settings.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.settings.rust-target }}/release
          7z a ../../../../r2modmac_windows_${{ matrix.settings.arch }}.zip r2modmac.exe

      - name: Package Linux Binary
        if: startsWith(matrix.settings.platform, 'ubuntu-')
        run: |
          cd src-tauri/target/${{ matrix.settings.rust-target }}/release
          # The self-updater (stage_linux_update in secure_system_commands.rs) requires
          # this archive to contain exactly one entry: the executable named "r2modmac"
          # at the archive root.
          tar -czf ../../../../r2modmac_linux_${{ matrix.settings.arch }}.tar.gz r2modmac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.settings.rust-target }}
          path: |
            r2modmac_macos_${{ matrix.settings.arch }}.dmg
            r2modmac_windows_${{ matrix.settings.arch }}.zip
            r2modmac_linux_${{ matrix.settings.arch }}.tar.gz
          if-no-files-found: ignore
          retention-days: 1

      # Runs even when the build fails, so no certificate or key outlives it.
      - name: Remove signing material (macOS)
        if: always() && matrix.settings.platform == 'macos-latest'
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/certificate.p12"

  release:
    needs: build
    # A manual run only builds; it never publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: build-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            - Interface changes and fixes
            - Improved UI
            - Fixed the sidebar display after enabling or disabling a mod
            - Fixed an issue that could cause updates to fail silently
            - Small changes to theme presets and icons
            - Added version information in settings
            - Fixed the missing cover for some communities
            - Removed size limits for downloading and extracting mods
            - Fixed Steam detection through Sikarugir and Hades II mod synchronization
            - Fixed the installation of Hell2Modding and ReturnOfModding in the `Hades II/Ship` folder
          files: |
            release_files/*.dmg
            release_files/*.zip
            release_files/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
