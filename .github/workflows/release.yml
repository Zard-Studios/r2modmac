name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.settings.platform }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: "Apple Silicon"
            platform: "macos-latest"
            rust-target: "aarch64-apple-darwin"
            arch: "aarch64"
          - name: "Intel"
            platform: "macos-latest"
            rust-target: "x86_64-apple-darwin"
            arch: "x86_64"
          - name: "Universal"
            platform: "macos-latest"
            rust-target: "universal-apple-darwin"
            arch: "universal"
          - name: "Windows x64"
            platform: "windows-latest"
            rust-target: "x86_64-pc-windows-msvc"
            arch: "x64"
          - name: "Windows x86"
            platform: "windows-latest"
            rust-target: "i686-pc-windows-msvc"
            arch: "x86"
          - name: "Windows ARM64"
            platform: "windows-latest"
            rust-target: "aarch64-pc-windows-msvc"
            arch: "arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust (macOS)
        if: matrix.settings.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Rust (Windows)
        if: matrix.settings.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-target }}

      - name: Install dependencies
        run: npm ci

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          node -e "
            const fs = require('fs');
            const version = process.argv[1];
            
            // Update package.json
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            
            // Update tauri.conf.json
            const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
            tauriConf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2));
            
            console.log('Synchronized package.json and tauri.conf.json version to ' + version);
          " "$TAG_VERSION"

      - name: Install create-dmg
        if: matrix.settings.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Build Tauri app (macOS)
        if: matrix.settings.platform == 'macos-latest'
        run: npm run tauri build -- --target ${{ matrix.settings.rust-target }} --bundles app

      - name: Build Tauri app (Windows)
        if: matrix.settings.platform == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.settings.rust-target }} --no-bundle

      - name: Create Custom DMG
        if: matrix.settings.platform == 'macos-latest'
        run: |
          mkdir -p dmg_root
          cp -r src-tauri/target/${{ matrix.settings.rust-target }}/release/bundle/macos/r2modmac.app dmg_root/
          cp UNVERIFIED_APP_INSTRUCTIONS.txt dmg_root/
          
          # Create DMG
          create-dmg \
            --volname "r2modmac" \
            --volicon "src-tauri/icons/icon.icns" \
            --window-pos 200 120 \
            --window-size 800 500 \
            --icon-size 100 \
            --icon "r2modmac.app" 200 190 \
            --hide-extension "r2modmac.app" \
            --app-drop-link 600 185 \
            --icon "UNVERIFIED_APP_INSTRUCTIONS.txt" 400 350 \
            "r2modmac_${{ matrix.settings.arch }}.dmg" \
            "dmg_root"

      - name: Package Windows Binary
        if: matrix.settings.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.settings.rust-target }}/release
          7z a ../../../../r2modmac_${{ matrix.settings.arch }}.zip r2modmac.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.settings.arch }}
          path: |
            r2modmac_${{ matrix.settings.arch }}.dmg
            r2modmac_${{ matrix.settings.arch }}.zip
          if-no-files-found: ignore
          retention-days: 1

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: build-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release_files/*.dmg
            release_files/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
