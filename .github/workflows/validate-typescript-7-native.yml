name: Validate TypeScript 7 native migration

on:
  push:
    branches:
      - chore/typescript-7-native

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: macos-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/typescript-7-native
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Install the official TypeScript 7 side-by-side configuration
        shell: bash
        run: |
          npm install --save-dev \
            '@typescript/native@npm:typescript@^7.0.2' \
            'typescript@npm:@typescript/typescript6@^6.0.2' \
            'typescript-eslint@^8.65.0'

      - name: Verify compiler and API versions
        shell: bash
        run: |
          COMPILER_VERSION=$(npx tsc --version)
          echo "$COMPILER_VERSION"
          [[ "$COMPILER_VERSION" == Version\ 7.* ]]

          API_VERSION=$(node -e "const ts = require('typescript'); process.stdout.write(ts.version)")
          echo "TypeScript API: $API_VERSION"
          [[ "$API_VERSION" == 6.* ]]

      - name: Build and lint
        run: |
          npm run build
          npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Remove temporary workflow
        run: rm .github/workflows/validate-typescript-7-native.yml

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/validate-typescript-7-native.yml
          git commit -m 'chore: adopt TypeScript 7 native compiler'
          git push origin HEAD:chore/typescript-7-native

      - name: Open, merge, and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head chore/typescript-7-native \
            --title 'chore: adopt TypeScript 7 native compiler' \
            --body $'## What changed\n- use TypeScript 7 as the native `tsc` compiler\n- retain the TypeScript 6 API package required by `typescript-eslint`\n- update `typescript-eslint` to a compatible release\n\n## Validation\n- verified native compiler reports TypeScript 7\n- verified imported compiler API reports TypeScript 6\n- production build\n- ESLint\n- production dependency audit')
          gh pr merge "$PR_URL" \
            --squash \
            --delete-branch \
            --subject 'chore: adopt TypeScript 7 native compiler' \
            --body 'Use the official side-by-side TypeScript 7 compiler and TypeScript 6 API configuration after successful build, lint, and audit checks.'
